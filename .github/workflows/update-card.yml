name: Update Profile Card

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r profile-card/requirements.txt

      - name: Generate card
        env:
          CARD_TOKEN: ${{ secrets.CARD_TOKEN }}
        run: python profile-card/generate_card.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet --exit-code profile-card/output/card.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card/output/card.svg
          git commit -m "chore: update profile card [skip ci]"
          git push
